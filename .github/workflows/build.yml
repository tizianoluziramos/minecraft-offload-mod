name: Build Fabric Mod (26.1.2) - Release manual

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (no debe existir aun), p. ej. v1.0.0"
        required: true
        type: string
        default: "v1.0.0"
      prerelease:
        description: "Marcar la release como prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-fabric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fabric-release:
    name: Compilar remapJar y crear GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (loom y el mod targetean Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validar wrapper de Gradle
        run: chmod +x gradlew && ./gradlew --version

      - name: Compilar el mod y el servidor (Fabric 26.1.2 + fat-jar)
        run: ./gradlew :client-mod:jar :remote-server:fatJar --no-daemon --stacktrace

      - name: Localizar el jar del mod
        id: locate
        shell: bash
        run: |
          FILE="$(find client-mod/build/libs -name 'remote-offload-*.jar' ! -name '*sources*' ! -name '*-dev*' ! -name '*-slim*' | sort | tail -n 1)"
          if [ -z "$FILE" ]; then
            echo "::error::No se encontro el jar en client-mod/build/libs"
            exit 1
          fi
          echo "jar=$FILE" >> "$GITHUB_ENV"
          echo "File: $FILE"

      - name: Localizar el fat-jar del servidor
        id: locate-server
        shell: bash
        run: |
          SERVER="$(find remote-server/build/libs -name 'remote-server-*-fat.jar' | sort | tail -n 1)"
          if [ -z "$SERVER" ]; then
            echo "::error::No se encontro el fat-jar en remote-server/build/libs"
            exit 1
          fi
          echo "server=$SERVER" >> "$GITHUB_ENV"
          echo "Server: $SERVER"

      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FLAGS=""
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "${{ inputs.tag }}" "$jar" "$server" $FLAGS \
            --title "Remote Offload ${{ inputs.tag }}" \
            --notes "Build manual de Fabric para Minecraft 26.1.2 (Fabric Loader 0.18.4, Fabric API 0.152.1+26.1.2). Jars: $(basename "$jar"), $(basename "$server")"