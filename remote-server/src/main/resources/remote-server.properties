# Remote Offload - servidor (ejemplo). Copiar a remote-server.properties
bind=0.0.0.0
port=19724

# Auth. Deja requireAuth=false y token vacío solo para LAN/demos.
requireAuth=true
token=cambia-esto-por-tu-token-largo
allowedClientIds=

# Trabajo
workers=8
maxConcurrentPerClient=4
workerTimeoutMs=30000
maxPending=1024
compressLevel=6

# Red
maxFramePayload=65536
maxPacketBytes=1048576
rateLimitPerSec=120
heartbeatTimeoutMs=10000
handshakeTimeoutMs=10000

# Cache
cacheDir=cache
cacheMaxMB=256
logFile=remote-server.log
console=true