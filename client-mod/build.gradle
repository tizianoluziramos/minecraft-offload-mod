plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.version
group = rootProject.group

// --- vínculos con la librería compartida (dev.remoteoffload.common) ---------
dependencies {
    implementation project(':common')
}

base {
    archivesName = 'remote-offload'
}

// Fuentes separadas: lib de "mundo puro"/red en src/main, código que toca
// Minecraft (client) en src/client. Loom crea y cablea el sourceSet 'client'
// con splitEnvironmentSourceSets() (src/client/java por defecto y classpath
// extendido desde 'main').
loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}